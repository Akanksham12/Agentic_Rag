# Evaluation set for the agentic RAG system.
#
# Each item has:
#   id              - stable identifier
#   type            - in-scope | multi-hop | out-of-scope | injection
#   question        - the user query
#   expected_answer - reference answer (empty for refusal cases)
#   expected_source - filename that SHOULD be retrieved (empty for refusal cases)
#
# The set is intentionally mixed: answering correctly and *refusing* correctly
# are both measured.

- id: q1
  type: in-scope
  question: "What is the core idea behind the Transformer architecture?"
  expected_answer: >
    The Transformer dispenses with recurrence and convolutions entirely and
    relies solely on self-attention to model dependencies between input and
    output tokens.
  expected_source: "attention_is_all_you_need.pdf"

- id: q2
  type: in-scope
  question: "What is multi-head attention and why is it used?"
  expected_answer: >
    Multi-head attention runs several attention functions in parallel on
    projected versions of the queries, keys, and values, letting the model
    jointly attend to information from different representation subspaces.
  expected_source: "attention_is_all_you_need.pdf"

- id: q3
  type: in-scope
  question: "What pre-training objectives does BERT use?"
  expected_answer: >
    BERT is pre-trained with a masked language model (MLM) objective and a
    next-sentence prediction (NSP) objective.
  expected_source: "bert.pdf"

- id: q4
  type: in-scope
  question: "What two types of memory does Retrieval-Augmented Generation combine?"
  expected_answer: >
    RAG combines parametric memory (a pre-trained seq2seq generator) with
    non-parametric memory (a dense vector index of Wikipedia accessed by a
    retriever).
  expected_source: "rag.pdf"

- id: q5
  type: in-scope
  question: "What is chain-of-thought prompting?"
  expected_answer: >
    Chain-of-thought prompting provides exemplars that include intermediate
    reasoning steps, eliciting step-by-step reasoning from the model and
    improving performance on complex reasoning tasks.
  expected_source: "chain_of_thought.pdf"

- id: q6
  type: in-scope
  question: "What problem does LoRA address in fine-tuning large models?"
  expected_answer: >
    LoRA enables parameter-efficient fine-tuning: it freezes the pre-trained
    weights and injects trainable low-rank decomposition matrices, drastically
    reducing the number of trainable parameters and memory required.
  expected_source: "lora.pdf"

- id: q7
  type: multi-hop
  question: "How does LoRA reduce the number of trainable parameters compared to full fine-tuning?"
  expected_answer: >
    Instead of updating all weights, LoRA keeps them frozen and learns a
    low-rank update (two small matrices A and B) for selected weight matrices,
    so only the small low-rank factors are trained.
  expected_source: "lora.pdf"

- id: q8
  type: out-of-scope
  question: "What's a good recipe for chocolate chip cookies?"
  expected_answer: ""
  expected_source: ""

