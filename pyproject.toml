[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG system with adaptive-corrective retrieval, an evaluation harness, and a swappable local/cloud LLM provider — served over FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jdnidish" }]

dependencies = [
    # Web service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",      # multipart file upload for /ingest
    "pydantic>=2.7",
    "pydantic-settings>=2.3",       # typed config from .env

    # Ingestion + retrieval
    "pypdf>=4.2",                   # PDF text extraction
    "sentence-transformers>=3.0",   # local MiniLM embeddings
    "chromadb>=0.5",                # persistent local vector DB

    # Agent
    "langgraph>=0.2",               # the agent state graph
    "langchain-core>=0.3",          # message types langgraph builds on

    # LLM providers
    "httpx>=0.27",                  # talks to the local Ollama HTTP API
    "groq>=0.11",                   # cloud free-tier provider

    # Eval + ops
    "pyyaml>=6.0",                  # eval_set.yaml
    "rich>=13.7",                   # results table
    "structlog>=24.1",              # structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
